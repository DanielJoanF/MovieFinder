<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Finder & Player</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="dark-theme">
  <header class="app-header">
    <div class="logo"> <span>MovieFinder</span></div>
    <nav class="nav-links">
      <button id="nav-trending" class="nav-btn active">Trending</button>
      <button id="nav-library" class="nav-btn">Library / Favorit</button>
    </nav>
  </header>

  <main class="main-content">
    <!-- Search Bar -->
    <section class="search-section">
      <form id="search-form">
        <input type="text" id="search-input" placeholder="Cari film favoritmu..." autocomplete="off" />
        <button type="submit">Cari</button>
      </form>
    </section>

    <!-- Content Sections Container -->
    <section id="content-container">
      <div id="movies-grid" class="movies-grid"></div>
      <div id="detail-view" class="detail-view hidden"></div>
      <div id="player-view" class="player-view hidden"></div>
    </section>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
